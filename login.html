<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 — ToolWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --md-sys-color-primary: oklch(48% 0.18 285);
      --md-sys-color-on-primary: #fff;
      --md-sys-color-primary-container: oklch(90% 0.08 285);
      --md-sys-color-on-primary-container: oklch(20% 0.10 285);
      --md-sys-color-secondary: oklch(55% 0.12 300);
      --md-sys-color-on-secondary: #fff;
      --md-sys-color-secondary-container: oklch(92% 0.06 300);
      --md-sys-color-on-secondary-container: oklch(22% 0.08 300);
      --md-sys-color-error: oklch(55% 0.18 25);
      --md-sys-color-on-error: #fff;
      --md-sys-color-error-container: oklch(95% 0.08 25);
      --md-sys-color-on-error-container: oklch(30% 0.12 25);
      --md-sys-color-background: oklch(97% 0.005 275);
      --md-sys-color-on-background: oklch(15% 0.02 275);
      --md-sys-color-surface: oklch(99% 0.002 275);
      --md-sys-color-on-surface: oklch(15% 0.02 275);
      --md-sys-color-surface-variant: oklch(93% 0.01 275);
      --md-sys-color-on-surface-variant: oklch(40% 0.02 275);
      --md-sys-color-outline: oklch(82% 0.01 275);
      --md-sys-color-outline-variant: oklch(88% 0.01 275);
      --md-sys-elevation-1: 0 1px 3px oklch(0% 0 0 / 0.08), 0 1px 2px oklch(0% 0 0 / 0.06);
      --md-sys-elevation-2: 0 4px 6px oklch(0% 0 0 / 0.07), 0 2px 4px oklch(0% 0 0 / 0.06);
      --md-sys-elevation-3: 0 10px 24px oklch(0% 0 0 / 0.10), 0 4px 8px oklch(0% 0 0 / 0.06);
      --md-sys-elevation-4: 0 16px 48px oklch(0% 0 0 / 0.12), 0 8px 16px oklch(0% 0 0 / 0.08);
      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --shape-corner-s: 8px;
      --shape-corner-m: 12px;
      --shape-corner-l: 16px;
      --transition-duration: 0.3s;
    }
    [data-theme="dark"] {
      --md-sys-color-primary: oklch(78% 0.15 285);
      --md-sys-color-on-primary: oklch(18% 0.10 285);
      --md-sys-color-primary-container: oklch(30% 0.14 285);
      --md-sys-color-on-primary-container: oklch(90% 0.08 285);
      --md-sys-color-secondary: oklch(75% 0.10 300);
      --md-sys-color-on-secondary: oklch(20% 0.08 300);
      --md-sys-color-secondary-container: oklch(32% 0.08 300);
      --md-sys-color-on-secondary-container: oklch(92% 0.06 300);
      --md-sys-color-error: oklch(78% 0.16 25);
      --md-sys-color-on-error: oklch(20% 0.10 25);
      --md-sys-color-error-container: oklch(35% 0.12 25);
      --md-sys-color-on-error-container: oklch(95% 0.08 25);
      --md-sys-color-background: oklch(12% 0.015 275);
      --md-sys-color-on-background: oklch(92% 0.008 275);
      --md-sys-color-surface: oklch(16% 0.015 275);
      --md-sys-color-on-surface: oklch(92% 0.008 275);
      --md-sys-color-surface-variant: oklch(24% 0.015 275);
      --md-sys-color-on-surface-variant: oklch(70% 0.01 275);
      --md-sys-color-outline: oklch(35% 0.015 275);
      --md-sys-color-outline-variant: oklch(28% 0.015 275);
      --md-sys-elevation-1: 0 1px 3px oklch(0% 0 0 / 0.30), 0 1px 2px oklch(0% 0 0 / 0.24);
      --md-sys-elevation-2: 0 4px 6px oklch(0% 0 0 / 0.28), 0 2px 4px oklch(0% 0 0 / 0.24);
      --md-sys-elevation-3: 0 10px 24px oklch(0% 0 0 / 0.30), 0 4px 8px oklch(0% 0 0 / 0.24);
      --md-sys-elevation-4: 0 16px 48px oklch(0% 0 0 / 0.40), 0 8px 16px oklch(0% 0 0 / 0.28);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      font-family: var(--font-body);
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background var(--transition-duration), color var(--transition-duration);
    }
    input, button, textarea, select { font: inherit; }
    .theme-toggle {
      position: fixed; top: 20px; right: 20px;
      z-index: 100;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface-variant);
      box-shadow: var(--md-sys-elevation-2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
    }
    .theme-toggle:hover { background: var(--md-sys-color-surface-variant); box-shadow: var(--md-sys-elevation-3); }
    .theme-toggle svg { width: 22px; height: 22px; transition: transform 0.4s ease; }
    .theme-toggle .sun-icon { display: none; }
    .theme-toggle .moon-icon { display: block; }
    [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
    [data-theme="dark"] .theme-toggle .moon-icon { display: none; }
    .theme-toggle:active svg { transform: scale(0.85); }
    .page-wrap {
      display: flex; min-height: 100vh;
      align-items: center; justify-content: center;
      padding: 24px;
      position: relative; overflow: hidden;
    }
    .page-wrap::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: var(--md-sys-color-primary-container);
      top: -200px; right: -150px;
      opacity: 0.3;
      pointer-events: none;
      transition: background var(--transition-duration);
    }
    .page-wrap::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: var(--md-sys-color-secondary-container);
      bottom: -100px; left: -100px;
      opacity: 0.2;
      pointer-events: none;
      transition: background var(--transition-duration);
    }
    .auth-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: var(--md-sys-color-surface);
      border-radius: var(--shape-corner-l);
      box-shadow: var(--md-sys-elevation-3);
      padding: 48px 40px 40px;
      transition: background var(--transition-duration), box-shadow var(--transition-duration);
      animation: card-enter 0.5s ease-out;
    }
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
    }
    .brand-text {
      font-family: var(--font-display);
      font-weight: 700; font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--md-sys-color-on-surface);
      transition: color var(--transition-duration);
    }
    .brand-text span { color: var(--md-sys-color-primary); transition: color var(--transition-duration); }
    .auth-title {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.02em; line-height: 1.2;
      margin: 0 0 24px;
      color: var(--md-sys-color-on-surface);
      transition: color var(--transition-duration);
    }
    .field-group { margin-bottom: 20px; }
    .field-label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px; letter-spacing: 0.01em;
      transition: color var(--transition-duration);
    }
    .input-wrap { position: relative; }
    .input-wrap .input {
      display: block; width: 100%;
      padding: 14px 16px; font-size: 15px; font-family: var(--font-body);
      background: transparent;
      border: 1.5px solid var(--md-sys-color-outline);
      border-radius: var(--shape-corner-s);
      color: var(--md-sys-color-on-surface);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background var(--transition-duration), color var(--transition-duration);
      -webkit-appearance: none; appearance: none;
    }
    .input-wrap .input::placeholder { color: var(--md-sys-color-on-surface-variant); opacity: 0.6; }
    .input-wrap .input:hover { border-color: var(--md-sys-color-on-surface-variant); }
    .input-wrap .input:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px var(--md-sys-color-primary-container);
    }
    .input-wrap .input.error { border-color: var(--md-sys-color-error); }
    .input-wrap .input.error:focus { box-shadow: 0 0 0 3px var(--md-sys-color-error-container); }
    .field-error {
      font-size: 12px; color: var(--md-sys-color-error);
      margin-top: 4px;
      display: none;
      align-items: center; gap: 4px;
      transition: color var(--transition-duration);
    }
    .field-error.visible { display: flex; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer; padding: 4px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .pw-toggle:hover { background: var(--md-sys-color-surface-variant); }
    .pw-toggle svg { width: 20px; height: 20px; }
    .row-options {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .checkbox-wrap {
      display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .checkbox-visual {
      width: 20px; height: 20px;
      border-radius: 4px;
      border: 2px solid var(--md-sys-color-outline);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .checkbox-wrap input:checked + .checkbox-visual {
      background: var(--md-sys-color-primary);
      border-color: var(--md-sys-color-primary);
    }
    .checkbox-wrap input:checked + .checkbox-visual::after {
      content: '';
      width: 10px; height: 5px;
      border-left: 2px solid var(--md-sys-color-on-primary);
      border-bottom: 2px solid var(--md-sys-color-on-primary);
      transform: rotate(-45deg) translateY(-1px);
    }
    .checkbox-label { font-size: 14px; color: var(--md-sys-color-on-surface-variant); transition: color var(--transition-duration); }
    .forgot-link {
      font-size: 13px; color: var(--md-sys-color-primary);
      text-decoration: none; font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      padding: 14px 24px;
      font-family: var(--font-display);
      font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: var(--shape-corner-l);
      cursor: pointer;
      transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-primary:hover:not(:disabled) { box-shadow: var(--md-sys-elevation-2); filter: brightness(1.08); }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2.5px solid var(--md-sys-color-on-primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-primary.loading .spinner { display: inline-block; }
    .btn-primary.loading .btn-text { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .snackbar {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--md-sys-color-on-surface);
      color: var(--md-sys-color-surface);
      padding: 14px 24px;
      border-radius: var(--shape-corner-s);
      font-size: 14px; font-weight: 500;
      box-shadow: var(--md-sys-elevation-3);
      z-index: 200;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; gap: 10px;
      max-width: 90vw;
    }
    .snackbar.visible { transform: translateX(-50%) translateY(0); }
    .snackbar.error { padding-left: 20px; }
    .snackbar.error::before {
      content: '';
      position: absolute; left: 0; top: 6px; bottom: 6px;
      width: 4px; border-radius: 2px;
      background: var(--md-sys-color-error);
    }
    .fade-in { animation: fade-slide-up 0.4s ease-out both; }
    @keyframes fade-slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.10s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.20s; }
    .stagger-5 { animation-delay: 0.25s; }
    .stagger-6 { animation-delay: 0.30s; }
    @media (max-width: 520px) {
      .page-wrap { padding: 12px; align-items: flex-start; padding-top: 60px; }
      .page-wrap::before, .page-wrap::after { display: none; }
      .auth-card { padding: 32px 24px 28px; border-radius: var(--shape-corner-m); box-shadow: var(--md-sys-elevation-2); }
      .auth-title { font-size: 24px; margin-bottom: 20px; }
      .brand { margin-bottom: 24px; }
      .theme-toggle { top: 12px; right: 12px; width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="page-wrap">
    <div class="auth-card">
      <div class="brand fade-in">
        <div class="brand-text">ToolWeb</div>
      </div>
      <h1 class="auth-title fade-in stagger-1">欢迎回来</h1>

      <div id="errorBanner" style="display:none; background:var(--md-sys-color-error-container); color:var(--md-sys-color-on-error-container); padding:12px 16px; border-radius:var(--shape-corner-s); margin-bottom:20px; font-size:13px; font-weight:500; align-items:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="errorText">用户名或密码错误，请重试。</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group fade-in stagger-2">
          <label class="field-label" for="username">用户名</label>
          <div class="input-wrap">
            <input class="input" id="username" type="text" placeholder="输入你的用户名" autocomplete="username" required />
          </div>
          <div class="field-error" id="usernameError">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            <span>请输入用户名</span>
          </div>
        </div>
        <div class="field-group fade-in stagger-3">
          <label class="field-label" for="password">密码</label>
          <div class="input-wrap">
            <input class="input" id="password" type="password" placeholder="输入你的密码" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="切换密码可见性" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="passwordError">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            <span>请输入密码</span>
          </div>
        </div>
        <div class="row-options fade-in stagger-4">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe" />
            <span class="checkbox-visual"></span>
            <span class="checkbox-label">记住我</span>
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>
        <button type="submit" class="btn-primary fade-in stagger-5" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">登录</span>
        </button>
      </form>
      <p style="text-align:center; margin-top:28px; font-size:14px; color:var(--md-sys-color-on-surface-variant);">
        还没有账号？<a href="register.html" style="color:var(--md-sys-color-primary); text-decoration:none; font-weight:600;">立即注册</a>
      </p>
    </div>
  </div>

  <div class="snackbar" id="snackbar">
    <span id="snackbarText"></span>
  </div>

  <script>
    (function() {
      const themeToggle = document.getElementById('themeToggle');
      const storedTheme = localStorage.getItem('toolweb-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = storedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', initialTheme);
      themeToggle.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('toolweb-theme', next);
      });
      const pwInput = document.getElementById('password');
      const pwToggle = document.getElementById('pwToggle');
      pwToggle.addEventListener('click', function() {
        const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwInput.setAttribute('type', type);
        pwToggle.innerHTML = type === 'password'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
      });
      const form = document.getElementById('loginForm');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');
      const loginBtn = document.getElementById('loginBtn');
      const errorBanner = document.getElementById('errorBanner');
      const errorText = document.getElementById('errorText');
      function clearErrors() {
        username.classList.remove('error'); password.classList.remove('error');
        usernameError.classList.remove('visible'); passwordError.classList.remove('visible');
        errorBanner.style.display = 'none';
      }
      function showFieldError(input, errorEl, message) {
        input.classList.add('error');
        errorEl.querySelector('span').textContent = message;
        errorEl.classList.add('visible');
      }
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        clearErrors();
        let valid = true;
        if (!username.value.trim()) { showFieldError(username, usernameError, '请输入用户名'); valid = false; }
        if (!password.value) { showFieldError(password, passwordError, '请输入密码'); valid = false; }
        if (!valid) return;
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;
        setTimeout(function() {
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
          window.location.href = 'index.html';
        }, 1500);
      });
      username.addEventListener('input', function() {
        if (username.classList.contains('error')) { username.classList.remove('error'); usernameError.classList.remove('visible'); }
      });
      password.addEventListener('input', function() {
        if (password.classList.contains('error')) { password.classList.remove('error'); passwordError.classList.remove('visible'); }
      });
      setTimeout(function() { username.focus(); }, 400);
    })();
  </script>
</body>
</html>
