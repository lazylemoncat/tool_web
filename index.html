<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo · Kanban</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@0.472.0/dist/umd/lucide.js"></script>
<style>
/* ========== MD3 Theme — Purple ========== */
:root {
  --primary: #6750A4;
  --primary-hover: #5A4292;
  --primary-active: #4E3780;
  --on-primary: #FFFFFF;
  --primary-container: #EADDFF;
  --on-primary-container: #21005D;
  --secondary: #625B71;
  --secondary-container: #E8DEF8;
  --surface: #FFFBFE;
  --surface-dim: #DED8E1;
  --surface-container: #F3EDF7;
  --surface-container-low: #F7F2FA;
  --surface-container-highest: #EDE7F0;
  --on-surface: #1D1B20;
  --on-surface-variant: #49454F;
  --outline: #CAC4D0;
  --outline-variant: #E7E0EC;
  --error: #BA1A1A;
  --error-container: #FFDAD6;
  --warning: #F57C00;
  --warning-container: #FFF0E0;
  --success: #1E7E34;
  --success-container: #D9F2DA;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-lg: 0 6px 20px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --sidebar-w: 280px;
  --font: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font: 14px/1.5 var(--font); color: var(--on-surface); background: var(--surface-dim); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--on-surface-variant); }
::selection { background: var(--primary-container); color: var(--on-primary-container); }

/* ===== Typography ===== */
.text-title-lg { font: 700 22px/1.3 var(--font); letter-spacing: -0.01em; }
.text-title-md { font: 600 16px/1.4 var(--font); }
.text-title-sm { font: 600 14px/1.4 var(--font); }
.text-body-md { font: 500 14px/1.5 var(--font); }
.text-body-sm { font: 400 13px/1.5 var(--font); }
.text-label-sm { font: 500 12px/1.4 var(--font); letter-spacing: 0.01em; }
.text-label-xs { font: 500 11px/1.3 var(--font); letter-spacing: 0.02em; }
.text-muted { color: var(--on-surface-variant); }
.font-mono { font-family: var(--font-mono); }
.tabular-nums { font-variant-numeric: tabular-nums; }

/* ===== Layout ===== */
.app-shell { display: flex; width: 100%; height: 100vh; background: var(--surface-dim); }
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--outline-variant); display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; background: var(--surface-dim); }

/* ===== Sidebar (MD3 Navigation Rail) ===== */
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-section { margin-bottom: 4px; }
.sidebar-section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 6px; }
.sidebar-section-title { font: 600 11px/1.3 var(--font); color: var(--on-surface-variant); letter-spacing: 0.08em; text-transform: uppercase; }
.sidebar-item { display: flex; align-items: center; gap: 12px; padding: 8px 20px; margin: 1px 8px; border-radius: var(--radius-xl); cursor: pointer; transition: all 0.15s; user-select: none; position: relative; }
.sidebar-item:hover { background: var(--surface-container); }
.sidebar-item.active { background: var(--primary-container); }
.sidebar-item.active::before { content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--primary); border-radius: 0 2px 2px 0; }
.sidebar-item-icon { width: 20px; height: 20px; flex-shrink: 0; color: var(--on-surface-variant); display: flex; align-items: center; justify-content: center; }
.sidebar-item.active .sidebar-item-icon { color: var(--primary); }
.sidebar-item-icon svg { width: 20px; height: 20px; }
.sidebar-item-text { flex: 1; font-size: 14px; font-weight: 500; color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-item.active .sidebar-item-text { color: var(--on-primary-container); font-weight: 600; }
.sidebar-item-badge { font-size: 12px; font-weight: 500; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
.sidebar-item.active .sidebar-item-badge { color: var(--primary); }
.folder-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.08); }
.folder-mode-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: var(--radius-xs); background: var(--primary-container); color: var(--primary); white-space: nowrap; line-height: 1.5; letter-spacing: 0.02em; }
.folder-expand-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--on-surface-variant); flex-shrink: 0; }
.folder-expand-btn:hover { background: var(--surface-container-highest); }
.folder-expand-btn svg { width: 16px; height: 16px; transition: transform 0.15s; }
.folder-expand-btn.expanded svg { transform: rotate(90deg); }
.folder-children { padding-left: 8px; }
.add-folder-btn { margin: 4px 12px; padding: 8px 16px; display: flex; align-items: center; gap: 10px; border-radius: var(--radius-xl); color: var(--on-surface-variant); font-size: 13px; font-weight: 500; transition: all 0.15s; width: calc(100% - 24px); }
.add-folder-btn:hover { background: var(--surface-container); color: var(--on-surface); }
.add-folder-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ===== Page Title Bar ===== */
.page-title-bar { display: flex; align-items: center; padding: 16px 28px 0; flex-shrink: 0; }
.page-title-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.page-title-folder { font: 700 22px/1.3 var(--font); letter-spacing: -0.01em; color: var(--on-surface); }
.page-title-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-xs); background: var(--primary-container); color: var(--primary); letter-spacing: 0.03em; }
.page-title-stats { font-size: 13px; color: var(--on-surface-variant); white-space: nowrap; }
.page-title-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.mobile-menu-btn { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; color: var(--on-surface-variant); flex-shrink: 0; }
.mobile-menu-btn:hover { background: var(--surface-container); }

/* ===== Toolbar Panel (MD3 Surface Container) ===== */
.toolbar-panel { display: flex; align-items: center; gap: 12px; margin: 12px 28px; padding: 8px 16px; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); border: 1px solid var(--outline-variant); flex-shrink: 0; flex-wrap: wrap; }
.toolbar-left { display: flex; align-items: center; gap: 8px; }
.toolbar-center { flex: 1; min-width: 200px; display: flex; justify-content: center; }
.toolbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }

/* MD3 Select / Dropdown */
.md3-select { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--radius-xl); background: var(--surface-container); color: var(--on-surface); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.15s; border: none; min-width: 130px; }
.md3-select:hover { background: var(--surface-container-highest); }
.md3-select:focus { box-shadow: 0 0 0 2px var(--primary); }
.md3-select svg { width: 16px; height: 16px; color: var(--on-surface-variant); flex-shrink: 0; }
.md3-select select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.md3-select-label { font-size: 11px; color: var(--on-surface-variant); font-weight: 400; }

/* MD3 Search Field */
.md3-search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--radius-xl); background: var(--surface-container); border: 1px solid transparent; transition: all 0.15s; width: 100%; max-width: 400px; }
.md3-search:focus-within { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
.md3-search svg { width: 16px; height: 16px; color: var(--on-surface-variant); flex-shrink: 0; }
.md3-search input { border: none; background: none; outline: none; width: 100%; font-size: 14px; color: var(--on-surface); }
.md3-search input::placeholder { color: var(--on-surface-variant); }

/* MD3 Icon Button */
.md3-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: var(--on-surface-variant); transition: all 0.15s; flex-shrink: 0; }
.md3-icon-btn:hover { background: var(--surface-container); color: var(--on-surface); }
.md3-icon-btn.active { background: var(--primary-container); color: var(--primary); }
.md3-icon-btn svg { width: 18px; height: 18px; }

/* MD3 Filled Button */
.md3-btn-filled { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 20px; border-radius: var(--radius-xl); background: var(--primary); color: var(--on-primary); font-size: 14px; font-weight: 600; white-space: nowrap; transition: all 0.15s; border: none; }
.md3-btn-filled:hover { background: var(--primary-hover); box-shadow: var(--shadow-sm); }
.md3-btn-filled:active { background: var(--primary-active); }
.md3-btn-filled svg { width: 16px; height: 16px; }

/* MD3 Filled Tonal Button */
.md3-btn-tonal { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--radius-xl); background: var(--primary-container); color: var(--on-primary-container); font-size: 12px; font-weight: 600; white-space: nowrap; transition: all 0.15s; }
.md3-btn-tonal:hover { box-shadow: var(--shadow-xs); }
.md3-btn-tonal:disabled { opacity: 0.38; cursor: default; box-shadow: none; }
.md3-btn-tonal svg { width: 14px; height: 14px; }

/* MD3 Text Button */
.md3-btn-text { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: var(--radius-xl); color: var(--on-surface-variant); font-size: 12px; font-weight: 600; transition: all 0.15s; }
.md3-btn-text:hover { background: var(--surface-container); color: var(--on-surface); }
.md3-btn-text svg { width: 14px; height: 14px; }

/* MD3 Chip */
.md3-chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; white-space: nowrap; border: none; }
.md3-chip-p0 { background: #FFDAD6; color: #410002; }
.md3-chip-p1 { background: #FFE0B2; color: #5E3C00; }
.md3-chip-p2 { background: #FFF8E1; color: #5E5200; }
.md3-chip-p3 { background: var(--surface-container); color: var(--on-surface-variant); }
.md3-chip-type { padding: 0 7px; border-radius: var(--radius-xs); font-size: 10px; font-weight: 600; height: 20px; display: inline-flex; align-items: center; }
.md3-chip-type.bug { background: #FFDAD6; color: #410002; }
.md3-chip-type.feature { background: #DCE8FF; color: #001B3E; }
.md3-chip-type.chore { background: var(--surface-container); color: var(--on-surface-variant); }
.md3-chip-type.docs { background: #D9F2DA; color: #003A14; }
.md3-chip-type.epic { background: var(--primary-container); color: var(--on-primary-container); }
.md3-chip-type.refactor { background: #E8DEF8; color: #1D0068; }
.md3-chip-type.perf { background: #C6F0F0; color: #003737; }
.md3-tag { display: inline-flex; align-items: center; padding: 0 6px; height: 20px; border-radius: var(--radius-xs); font-size: 10px; font-weight: 500; background: var(--surface-container); color: var(--on-surface-variant); }
.md3-version-chip { display: inline-flex; align-items: center; padding: 0 6px; height: 20px; border-radius: var(--radius-xs); font-size: 10px; font-weight: 500; background: var(--surface-container-highest); color: var(--on-surface-variant); font-family: var(--font-mono); }

/* MD3 Divider */
.md3-divider { height: 1px; background: var(--outline-variant); margin: 8px 0; }
.toolbar-divider { width: 1px; height: 24px; background: var(--outline-variant); flex-shrink: 0; }

/* ===== Content Area ===== */
.content-area { flex: 1; min-height: 0; overflow: auto; padding: 0 28px 16px; }

/* ===== Todo List ===== */
.todo-empty { text-align: center; padding: 64px 24px; color: var(--on-surface-variant); }
.todo-empty svg { width: 48px; height: 48px; color: var(--outline); margin-bottom: 16px; }
.todo-empty p { font-size: 14px; margin-top: 4px; }
.todo-list-paper { border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.todo-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--outline-variant); transition: background 0.1s; cursor: pointer; }
.todo-item:last-child { border-bottom: none; }
.todo-item:hover { background: var(--surface-container); }
.todo-item.completed .todo-item-title { text-decoration: line-through; color: var(--on-surface-variant); opacity: 0.6; }
.todo-drag-handle { cursor: grab; color: var(--outline); display: flex; align-items: center; flex-shrink: 0; }
.todo-drag-handle:hover { color: var(--on-surface-variant); }
.todo-drag-handle svg { width: 16px; height: 16px; }
.todo-checkbox { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--outline); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.15s; background: var(--surface); }
.todo-checkbox:hover { border-color: var(--primary); }
.todo-checkbox.checked { background: var(--primary); border-color: var(--primary); }
.todo-checkbox.checked svg { color: var(--on-primary); }
.todo-checkbox svg { width: 14px; height: 14px; color: transparent; }
.pri-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pri-dot.p0 { background: var(--error); }
.pri-dot.p1 { background: var(--warning); }
.pri-dot.p2 { background: #F9A825; }
.pri-dot.p3 { background: var(--outline); }
.todo-item-content { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.todo-item-title { font-size: 14px; font-weight: 500; color: var(--on-surface); }
.todo-item-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.todo-chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 22px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 500; background: var(--surface-container); color: var(--on-surface-variant); white-space: nowrap; }
.todo-chip svg { width: 12px; height: 12px; }
.todo-chip.overdue { background: var(--error-container); color: var(--error); }
.todo-chip.subtask { background: var(--primary-container); color: var(--on-primary-container); }
.todo-chip.tag { background: var(--secondary-container); color: var(--secondary); }
.todo-item-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.todo-detail { background: var(--surface-container); border-bottom: 1px solid var(--outline-variant); padding: 16px 16px 16px 48px; }
.todo-detail-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.todo-detail-section { margin-bottom: 12px; }
.todo-detail-label { font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
.todo-detail-note { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
.todo-detail-subtasks { display: flex; flex-direction: column; gap: 4px; }
.todo-detail-subtask { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--radius-xs); }
.todo-detail-subtask:hover { background: var(--surface-container-highest); }
.todo-detail-actions { display: flex; gap: 6px; margin-top: 8px; }

/* ===== Kanban Board ===== */
.kb-board { display: flex; gap: 16px; height: calc(100vh - 200px); min-height: 380px; overflow-x: auto; padding-bottom: 12px; padding-right: 8px; }

/* ===== Kanban Column (MD3 Surface Container) ===== */
.kb-col { width: 300px; min-width: 280px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface-container); border-radius: var(--radius-xl); border: 1px solid var(--outline-variant); max-height: 100%; overflow: hidden; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; }
.kb-col.drag-over { border-color: var(--primary); background: var(--primary-container); box-shadow: 0 0 0 2px var(--primary-container); }

/* Column header */
.kb-col-header { padding: 14px 14px 10px; flex-shrink: 0; position: relative; }
.kb-col-cap-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: transparent; transition: background 0.2s; }
.kb-col.cap-full .kb-col-cap-bar { background: var(--warning); }
.kb-col-header-top { display: flex; align-items: flex-start; gap: 6px; }
.kb-col-info { flex: 1; min-width: 0; }
.kb-col-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.kb-col-name-cn { font-size: 12px; font-weight: 400; color: var(--on-surface-variant); }
.kb-col-count { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
.kb-col-count .md3-chip-count { display: inline-flex; align-items: center; padding: 0 8px; height: 20px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 600; background: var(--surface); color: var(--on-surface-variant); }
.kb-col-count .md3-chip-count svg { width: 12px; height: 12px; }
.kb-col.cap-full .kb-col-count .md3-chip-count { background: var(--warning-container); color: #5E3C00; }
.kb-col-actions { display: flex; gap: 2px; flex-shrink: 0; margin-top: -4px; }
.kb-col-actions .md3-icon-btn { width: 32px; height: 32px; }
.kb-col-actions .md3-icon-btn svg { width: 16px; height: 16px; }

/* Capacity warning chip */
.kb-col-cap-warn { display: none; align-items: center; gap: 4px; margin-top: 6px; padding: 0 10px; height: 22px; border-radius: var(--radius-sm); background: var(--warning-container); color: #5E3C00; font-size: 11px; font-weight: 600; }
.kb-col-cap-warn svg { width: 12px; height: 12px; flex-shrink: 0; }
.kb-col.cap-full .kb-col-cap-warn { display: inline-flex; }

/* Column body (scrollable cards area) */
.kb-col-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; }

/* Drop zone empty state */
.kb-col-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; border: 2px dashed var(--outline); border-radius: var(--radius-md); margin: 4px; padding: 20px 12px; color: var(--on-surface-variant); font-size: 12px; gap: 8px; transition: border-color 0.2s, background 0.2s; }
.kb-col-empty:hover { border-color: var(--primary); background: var(--primary-container); }
.kb-col-empty svg { width: 20px; height: 20px; color: var(--outline); }
.kb-col-empty button { font-size: 12px; font-weight: 600; color: var(--primary); padding: 4px 12px; border-radius: var(--radius-sm); }
.kb-col-empty button:hover { background: var(--primary-container); }

/* ===== Task Card (MD3 Elevated Card) ===== */
.kb-card { background: var(--surface); border: 1px solid var(--outline-variant); border-radius: var(--radius-lg); padding: 14px; cursor: pointer; transition: all 0.15s; user-select: none; }
.kb-card:hover { border-color: var(--outline); box-shadow: var(--shadow-sm); }
.kb-card.dragging { opacity: 0.4; box-shadow: var(--shadow-md); }
.kb-card.archived { opacity: 0.6; }
.kb-card.archived:hover { opacity: 0.85; }
.kb-card.blocked { border-left: 3px solid var(--error); }

/* Card chip row */
.kb-card-chips { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }

/* Card title */
.kb-card-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--on-surface); }

/* Card tag row */
.kb-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

/* Card metadata row */
.kb-card-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.kb-card-meta-item { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--on-surface-variant); }
.kb-card-meta-item svg { width: 12px; height: 12px; flex-shrink: 0; }
.kb-card-meta-item.danger { color: var(--error); }

/* Card actions */
.kb-card-actions { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--outline-variant); }
.kb-card-actions .md3-btn-tonal { flex: 1; justify-content: center; }
.kb-card-actions .md3-btn-text { flex: 1; justify-content: center; }

/* Card subtask progress bar */
.subtask-progress { width: 100%; height: 4px; background: var(--surface-container-highest); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
.subtask-progress-bar { height: 100%; border-radius: 2px; background: var(--primary); transition: width 0.2s; }
.subtask-progress-bar.done { background: var(--success); }
.subtask-progress-bar.partial { background: var(--primary); }

/* ===== Overlays & Modals (MD3) ===== */
.overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.32); display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.overlay.open { display: flex; }
.overlay-content { background: var(--surface); border-radius: var(--radius-2xl); box-shadow: 0 16px 48px rgba(0,0,0,0.15); max-width: 90vw; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; animation: modalIn 0.2s cubic-bezier(0.2,0,0,1); }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 16px; }
.modal-title { font: 600 18px/1.3 var(--font); color: var(--on-surface); }
.modal-body { padding: 0 24px 16px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 24px 20px; }

/* MD3 Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--outline-variant); margin-bottom: 16px; gap: 0; }
.tab { position: relative; padding: 10px 20px; font-size: 14px; font-weight: 500; color: var(--on-surface-variant); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.tab:hover { color: var(--on-surface); }
.tab.active { color: var(--primary); }
.tab.active::after { content: ''; position: absolute; bottom: 0; left: 12px; right: 12px; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* MD3 Form fields */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--on-surface); }
.form-input { width: 100%; height: 40px; padding: 0 14px; border: 1px solid var(--outline); border-radius: var(--radius-sm); font-size: 14px; background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s; }
.form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
.form-textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--outline); border-radius: var(--radius-sm); font-size: 14px; resize: vertical; min-height: 60px; background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s; }
.form-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
.form-select { width: 100%; height: 40px; padding: 0 14px; border: 1px solid var(--outline); border-radius: var(--radius-sm); font-size: 14px; background: var(--surface); cursor: pointer; transition: border-color 0.15s; }
.form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
.form-row { display: flex; gap: 16px; align-items: center; }
.segmented { display: inline-flex; background: var(--surface-container); border-radius: var(--radius-xl); padding: 3px; gap: 2px; }
.segmented button { padding: 6px 16px; border-radius: var(--radius-lg); font-size: 13px; font-weight: 500; color: var(--on-surface-variant); transition: all 0.15s; white-space: nowrap; }
.segmented button.active { background: var(--surface); color: var(--on-surface); box-shadow: var(--shadow-xs); }
.segmented button:not(.active):hover { color: var(--on-surface); }
.color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
.color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.color-swatch:hover { transform: scale(1.12); }
.color-swatch.active { border-color: var(--on-surface); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--primary); }

/* ===== Drawer (MD3 side panel) ===== */
.drawer-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.32); display: none; backdrop-filter: blur(2px); }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 90vw; z-index: 1001; background: var(--surface); box-shadow: -8px 0 32px rgba(0,0,0,0.1); display: none; flex-direction: column; animation: drawerIn 0.2s cubic-bezier(0.2,0,0,1); }
.drawer.open { display: flex; }
@keyframes drawerIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 16px; border-bottom: 1px solid var(--outline-variant); flex-shrink: 0; }
.drawer-header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.drawer-header-left .modal-title { font-size: 18px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-section { margin-bottom: 24px; }
.drawer-section-label { font-size: 11px; font-weight: 600; color: var(--on-surface-variant); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
.drawer-field-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.drawer-stat { font-size: 13px; color: var(--on-surface); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.drawer-stat svg { width: 14px; height: 14px; color: var(--on-surface-variant); }
.drawer-log-item { font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--outline-variant); color: var(--on-surface-variant); display: flex; align-items: center; gap: 6px; }
.drawer-log-item strong { color: var(--on-surface); font-weight: 600; }
.drawer-log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.drawer-log-time { margin-left: auto; font-size: 11px; color: var(--outline); }

/* ===== Toast ===== */
.toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--radius-md); background: #323232; color: #fff; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); animation: toastIn 0.2s ease; pointer-events: auto; }
.toast.warning { background: var(--warning); }
.toast.error { background: var(--error); }
.toast.success { background: var(--success); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Mobile responsive ===== */
@media (max-width: 768px) {
  .sidebar { position: fixed; left: -100%; top: 0; bottom: 0; z-index: 100; transition: left 0.25s; width: 280px; box-shadow: 4px 0 24px rgba(0,0,0,0.15); }
  .sidebar.open { left: 0; }
  .mobile-menu-btn { display: flex; }
  .page-title-bar { padding: 12px 16px 0; flex-wrap: wrap; gap: 8px; }
  .page-title-folder { font-size: 18px; }
  .page-title-actions .md3-btn-filled { padding: 0 14px; font-size: 13px; }
  .toolbar-panel { margin: 10px 12px; padding: 8px 12px; gap: 8px; }
  .toolbar-left { width: 100%; }
  .toolbar-center { width: 100%; order: 3; min-width: 0; }
  .toolbar-right { margin-left: 0; width: 100%; justify-content: flex-start; order: 2; }
  .md3-search { max-width: none; }
  .content-area { padding: 0 12px 12px; }
  .kb-board { gap: 12px; height: calc(100vh - 340px); min-height: 280px; }
  .kb-col { width: 280px; min-width: 260px; }
  .drawer { width: 100vw; max-width: 100vw; }
  .overlay-content { max-width: 95vw; }
}
@media (max-width: 480px) {
  .page-title-stats { display: none; }
  .toolbar-panel { margin: 8px 8px; padding: 8px; }
  .kb-col { width: 260px; min-width: 240px; }
  .page-title-actions .md3-btn-filled span { display: none; }
}
</style>
</head>
<body>

<div class="app-shell" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="sidebar-item active" data-view="all" onclick="selectView('all')">
          <span class="sidebar-item-icon" data-lucide="inbox"></span>
          <span class="sidebar-item-text">所有任务</span>
          <span class="sidebar-item-badge" id="count-all">0</span>
        </div>
        <div class="sidebar-item" data-view="today" onclick="selectView('today')">
          <span class="sidebar-item-icon" data-lucide="calendar"></span>
          <span class="sidebar-item-text">今天</span>
          <span class="sidebar-item-badge" id="count-today">0</span>
        </div>
        <div class="sidebar-item" data-view="upcoming" onclick="selectView('upcoming')">
          <span class="sidebar-item-icon" data-lucide="calendar-range"></span>
          <span class="sidebar-item-text">即将到期</span>
          <span class="sidebar-item-badge" id="count-upcoming">0</span>
        </div>
        <div class="sidebar-item" data-view="completed" onclick="selectView('completed')">
          <span class="sidebar-item-icon" data-lucide="check-circle-2"></span>
          <span class="sidebar-item-text">已完成</span>
          <span class="sidebar-item-badge" id="count-completed">0</span>
        </div>
      </div>

      <div class="md3-divider" style="margin:8px 16px;"></div>

      <div class="sidebar-section-header">
        <span class="sidebar-section-title">文件夹</span>
      </div>

      <div id="folder-tree"></div>

      <button class="add-folder-btn" onclick="openNewFolderDialog()">
        <span data-lucide="folder-plus"></span>
        新建文件夹
      </button>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main-area">

    <!-- Page Title Bar (replaces old header content) -->
    <div class="page-title-bar" id="page-title-bar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">
        <span data-lucide="menu"></span>
      </button>
      <div class="page-title-left" id="page-title-left">
        <!-- Filled by JS: folder name + tag + stats -->
      </div>
      <div class="page-title-actions" id="page-title-actions">
        <!-- Filled by JS: new task + settings buttons -->
      </div>
    </div>

    <!-- Toolbar Panel (Sprint + Search + Filter) -->
    <div class="toolbar-panel" id="toolbar-panel" style="display:none;">
      <div class="toolbar-left" id="toolbar-left">
        <!-- Sprint selector -->
      </div>
      <div class="toolbar-center" id="toolbar-center">
        <!-- Search -->
      </div>
      <div class="toolbar-right" id="toolbar-right">
        <!-- Filter / Sort / Density / Archive -->
      </div>
    </div>

    <!-- Content -->
    <div class="content-area" id="content-area">
      <!-- Filled by JS -->
    </div>

  </main>
</div>

<!-- ===== New Folder Dialog ===== -->
<div class="overlay" id="folder-dialog">
  <div class="overlay-content" style="width:520px;">
    <div class="modal-header">
      <span class="modal-title" id="folder-dialog-title">新建文件夹</span>
      <button class="md3-icon-btn" onclick="closeFolderDialog()"><span data-lucide="x"></span></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">文件夹名称</label>
        <input class="form-input" id="folder-name-input" placeholder="输入文件夹名称" />
      </div>
      <div class="form-group">
        <label class="form-label">颜色</label>
        <div class="color-picker" id="folder-color-picker"></div>
      </div>
      <div class="form-group">
        <label class="form-label">工作模式</label>
        <div class="segmented" id="folder-mode-select">
          <button class="active" data-mode="todo" onclick="selectFolderMode('todo')">Todo 列表</button>
          <button data-mode="kanban" onclick="selectFolderMode('kanban')">Kanban 看板</button>
        </div>
      </div>
      <div id="kanban-init-settings" style="display:none;">
        <div style="border:1px solid var(--outline-variant);border-radius:var(--radius-lg);padding:16px;background:var(--surface-container);margin-bottom:12px;">
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label" style="font-size:13px;">默认列预览</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Backlog</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Ready</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Doing</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Testing</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Ready to Release</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface);">Released</span>
              <span style="padding:4px 10px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--outline-variant);font-size:12px;font-weight:500;color:var(--on-surface-variant);text-decoration:line-through;">Archived</span>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label class="form-label" style="font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="use-default-columns" checked /> 使用默认 7 列
            </label>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label" style="font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="create-default-sprint" checked /> 创建默认 Sprint（当前 Sprint + 未分配）
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="md3-btn-text" onclick="closeFolderDialog()">取消</button>
      <button class="md3-btn-filled" id="folder-save-btn" onclick="saveFolder()">创建文件夹</button>
    </div>
  </div>
</div>

<!-- ===== Kanban Settings Modal (MD3) ===== -->
<div class="overlay" id="kanban-settings-modal">
  <div class="overlay-content" style="width:640px;">
    <div class="modal-header">
      <span class="modal-title">Kanban 设置</span>
      <button class="md3-icon-btn" onclick="closeKanbanSettings()"><span data-lucide="x"></span></button>
    </div>
    <div style="padding:0 24px;">
      <div class="tabs" id="settings-tabs">
        <span class="tab active" data-tab="columns" onclick="switchSettingsTab('columns')">列配置</span>
        <span class="tab" data-tab="fields" onclick="switchSettingsTab('fields')">任务卡模板</span>
        <span class="tab" data-tab="sprints" onclick="switchSettingsTab('sprints')">Sprint 管理</span>
        <span class="tab" data-tab="prefs" onclick="switchSettingsTab('prefs')">偏好设置</span>
      </div>
    </div>
    <div class="modal-body" style="min-height:340px;padding:0 24px 20px;">

      <!-- Tab: Columns -->
      <div class="tab-content active" id="tab-columns">
        <div id="column-list"></div>
        <button class="md3-btn-text" style="margin-top:12px;" onclick="addColumn()">
          <span data-lucide="plus" style="width:16px;height:16px;"></span> 新增列
        </button>
      </div>

      <!-- Tab: Fields -->
      <div class="tab-content" id="tab-fields">
        <div id="field-list"></div>
        <button class="md3-btn-text" style="margin-top:12px;" onclick="addCustomField()">
          <span data-lucide="plus" style="width:16px;height:16px;"></span> 新增字段
        </button>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--outline-variant);">
          <button class="md3-btn-text" onclick="resetFields()" style="color:var(--warning);">恢复默认模板</button>
        </div>
      </div>

      <!-- Tab: Sprints -->
      <div class="tab-content" id="tab-sprints">
        <div id="sprint-list"></div>
        <button class="md3-btn-text" style="margin-top:12px;" onclick="addSprint()">
          <span data-lucide="plus" style="width:16px;height:16px;"></span> 新建 Sprint
        </button>
      </div>

      <!-- Tab: Preferences -->
      <div class="tab-content" id="tab-prefs">
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" id="pref-show-archived" checked /> 显示归档任务
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" id="pref-allow-drag" checked /> 允许拖拽移动
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">默认新任务列</label>
          <select class="form-select" id="pref-default-col"></select>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <input type="checkbox" id="pref-remember-view" checked /> 记住该文件夹的最后筛选状态
          </label>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="md3-btn-filled" onclick="closeKanbanSettings()">完成</button>
    </div>
  </div>
</div>

<!-- ===== Column Delete Confirm (with task migration) ===== -->
<div class="overlay" id="delete-col-confirm">
  <div class="overlay-content" style="width:400px;">
    <div class="modal-header">
      <span class="modal-title">删除列</span>
      <button class="md3-icon-btn" onclick="closeDeleteColConfirm()"><span data-lucide="x"></span></button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:16px;font-size:14px;color:var(--on-surface);line-height:1.5;" id="delete-col-msg">该列中包含任务，请选择迁移目标：</p>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">迁移任务到</label>
        <select class="form-select" id="delete-col-target"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="md3-btn-text" onclick="closeDeleteColConfirm()">取消</button>
      <button class="md3-btn-filled" style="background:var(--error);" onclick="confirmDeleteColumn()">确认删除</button>
    </div>
  </div>
</div>

<!-- ===== Delete Sprint Confirm ===== -->
<div class="overlay" id="delete-sprint-confirm">
  <div class="overlay-content" style="width:400px;">
    <div class="modal-header">
      <span class="modal-title">删除 Sprint</span>
      <button class="md3-icon-btn" onclick="closeDeleteSprintConfirm()"><span data-lucide="x"></span></button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:16px;font-size:14px;color:var(--on-surface);line-height:1.5;" id="delete-sprint-msg">该 Sprint 中包含任务，请选择迁移方式：</p>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">迁移任务到</label>
        <select class="form-select" id="delete-sprint-target">
          <option value="unassigned">未分配</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="md3-btn-text" onclick="closeDeleteSprintConfirm()">取消</button>
      <button class="md3-btn-filled" style="background:var(--error);" onclick="confirmDeleteSprint()">确认删除</button>
    </div>
  </div>
</div>

<!-- ===== Task Detail Drawer (MD3) ===== -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="task-drawer">
  <div class="drawer-header">
    <div class="drawer-header-left">
      <span class="modal-title" id="drawer-title">任务详情</span>
    </div>
    <button class="md3-icon-btn" onclick="closeDrawer()"><span data-lucide="x"></span></button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <!-- Filled by JS -->
  </div>
</div>

<!-- ===== Sprint Edit Modal ===== -->
<div class="overlay" id="sprint-edit-modal">

    <div class="modal-header">

      <div class="form-row">

          <input class="form-input" type="date" id="sprint-edit-start" />

        <div class="form-group" style="flex:1;">

      <div class="form-group">

      <button class="md3-btn-text" onclick="closeSprintEdit()">取消</button>

  </div>
</div>

<!-- ===== Column Edit Modal ===== -->
<div class="overlay" id="column-edit-modal">

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  const all = state.todos;
  document.getElementById('count-all').textContent = all.length;
  document.getElementById('count-today').textContent = all.filter(t => {
    if (!t.dueDate) return false;
    const d = new Date(t.dueDate);
    const now = new Date();
    return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;
  document.getElementById('count-upcoming').textContent = all.filter(t => {
    if (!t.dueDate || t.completed) return false;
    const d = new Date(t.dueDate);
    const now = new Date();
    const diff = (d - now) / (1000*60*60*24);
    return diff >= 0 && diff <= 7;
  }).length;
  document.getElementById('count-completed').textContent = all.filter(t => t.completed).length;

  const tree = document.getElementById('folder-tree');
  let html = '';
  const rootFolders = state.folders.filter(f => !f.parent_id);
  for (const f of rootFolders) {
    html += renderFolderItem(f, 0);
  }
  tree.innerHTML = html;
  lucide.createIcons({root: tree});
}

function renderFolderItem(folder, depth) {
  const children = state.folders.filter(f => f.parent_id === folder.id);
  const hasChildren = children.length > 0;
  const isActive = state.currentView === 'folder-' + folder.id;
  const badge = folder.mode === 'kanban'
    ? '<span class="folder-mode-badge">Kanban</span>'
    : '<span data-lucide="folder" style="width:16px;height:16px;"></span>';

  let html = `<div class="sidebar-item ${isActive?'active':''}" style="padding-left:${20 + depth*20}px;" onclick="selectFolder(${folder.id})" oncontextmenu="showFolderMenu(event,${folder.id})">
    <span class="folder-color-dot" style="background:${folder.color};"></span>
    <span class="sidebar-item-text">${folder.name}</span>
    ${badge}
    <span class="sidebar-item-badge">${folder.todo_count}</span>
    ${hasChildren ? `<span class="folder-expand-btn" onclick="event.stopPropagation();toggleFolderChildren(this)" data-expanded="false"><span data-lucide="chevron-right"></span></span>` : ''}
  </div>`;
  if (hasChildren) {
    html += `<div class="folder-children" style="display:none;">`;
    for (const child of children) {
      html += renderFolderItem(child, depth + 1);
    }
    html += `</div>`;
  }
  return html;
}

function toggleFolderChildren(btn) {
  const expanded = btn.dataset.expanded === 'true';
  btn.dataset.expanded = !expanded;
  btn.classList.toggle('expanded', !expanded);
  const children = btn.closest('.sidebar-item').nextElementSibling;
  if (children && children.classList.contains('folder-children')) {
    children.style.display = expanded ? 'none' : 'block';
  }
}

function selectView(view) {
  state.currentView = view;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector(`.sidebar-item[data-view="${view}"]`);
  if (item) item.classList.add('active');
  closeSidebar();
  renderContent();
}

function selectFolder(id) {
  state.currentView = 'folder-' + id;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector(`.sidebar-item[onclick*="selectFolder(${id})"]`);
  if (item) item.classList.add('active');
  closeSidebar();
  renderContent();
}

function showFolderMenu(e, id) {
  e.preventDefault();
}

function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', state.sidebarOpen);
  if (state.sidebarOpen) {
    document.getElementById('sidebar-overlay') || (() => {
      const o = document.createElement('div');
      o.id = 'sidebar-overlay';
      o.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.3);';
      o.onclick = () => toggleSidebar();
      document.body.appendChild(o);
    })();
  } else {
    const o = document.getElementById('sidebar-overlay');
    if (o) o.remove();
  }
}

function closeSidebar() {
  if (window.innerWidth <= 768 && state.sidebarOpen) toggleSidebar();
}

function getViewName() {

  let todos = state.todos;
  const folder = getCurrentFolder();
  if (folder && folder.mode === 'todo') {
    todos = todos.filter(t => t.folder_id === folder.id);
  } else if (state.currentView === 'today') {
    todos = todos.filter(t => {
      if (!t.dueDate) return false;
      const d = new Date(t.dueDate); const now = new Date();
      return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
  } else if (state.currentView === 'upcoming') {
    todos = todos.filter(t => {
      if (!t.dueDate || t.completed) return false;
      const d = new Date(t.dueDate); const now = new Date();
      const diff = (d - now) / (1000*60*60*24);
      return diff >= 0 && diff <= 7;
    });
  } else if (state.currentView === 'completed') {
    todos = todos.filter(t => t.completed);
  }
  return todos;
}

function toggleTodoComplete(id) {

  if (todo) {
    todo.completed = !todo.completed;
    renderSidebar();
    renderContent();
  }
}

function editTodoFromList(id) {

}

function deleteTodoFromList(id) {
  if (confirm('确认删除此任务？')) {
    state.todos = state.todos.filter(t => t.id !== id && !(t.children && t.children.includes(id)));
    state.todos = state.todos.filter(t => t.id !== id);
    state.todos.forEach(t => {
      if (t.children) t.children = t.children.filter(c => c !== id);
    });
    renderSidebar();
    renderContent();
  }
}

function filterTodos(query) {

function renderKanbanBoard() {
  const area = document.getElementById('content-area');
  const sortedCols = [...state.columns].sort((a,b) => a.sort - b.sort);

  let html = `<div class="kb-board">`;

    const tasks = state.kanbanData[col.id] || [];
    const capFull = col.capacity > 0 && tasks.length >= col.capacity;
    html += `<div class="kb-col ${capFull?'cap-full':''}" data-col="${col.id}" ondrop="onDrop(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)">
      <div class="kb-col-cap-bar"></div>
      <div class="kb-col-header">
        <div class="kb-col-header-top">
          <div class="kb-col-info">
            <div class="kb-col-name">${col.name} <span class="kb-col-name-cn">${col.cn}</span></div>
            <div class="kb-col-count">
              <span class="md3-chip-count">${tasks.length}${col.capacity > 0 ? `<span style="font-weight:400;color:var(--outline);margin:0 2px;">/</span>${col.capacity}` : ''}</span>
            </div>
          </div>
          <div class="kb-col-actions">
            <button class="md3-icon-btn" onclick="openNewTask('${col.id}')" title="新增任务"><span data-lucide="plus"></span></button>

          </div>
        </div>
        <div class="kb-col-cap-warn"><span data-lucide="alert-triangle"></span> 已达上限</div>
      </div>
      <div class="kb-col-body">
        ${tasks.length === 0 ? `
        <div class="kb-col-empty">
          <span data-lucide="columns-2"></span>
          <span>拖拽任务到此处</span>
          <button onclick="openNewTask('${col.id}')">+ 新增任务</button>
        </div>` : tasks.map(task => renderKanbanCard(task, col)).join('')}
      </div>
    </div>`;
  }
  html += `</div>`;
  area.innerHTML = html;
  lucide.createIcons({root: area});
  document.querySelectorAll('.kb-card').forEach(card => {
    card.draggable = true;
    card.addEventListener('dragstart', onDragStart);
  });
}

function renderKanbanCard(task, col) {
  const isArchived = col.archived;
  const isReleasedOrArchived = col.id === 'col-released' || col.id === 'col-archived';
  const pClass = (task.priority || '').toLowerCase();
  const hasProgress = task.subtasks.total > 0;
  const progressPct = hasProgress ? Math.round((task.subtasks.done / task.subtasks.total) * 100) : 0;

  return `<div class="kb-card ${isArchived?'archived':''} ${task.blocked?'blocked':''}" data-task-id="${task.id}" data-col="${col.id}" onclick="openDrawer('${task.id}','${col.id}')">
    <div class="kb-card-chips">
      <span class="md3-chip md3-chip-${pClass}">${task.priority}</span>
      <span class="md3-chip-type ${task.type}">${task.type}</span>
      ${task.version && task.version !== '-' ? `<span class="md3-version-chip">${task.version}</span>` : ''}
    </div>
    <div class="kb-card-title">${task.title}</div>
    ${task.tags.length > 0 ? `<div class="kb-card-tags">${task.tags.map(t => `<span class="md3-tag">${t}</span>`).join('')}</div>` : ''}
    ${task.blocked ? `<div class="kb-card-meta"><span class="kb-card-meta-item danger"><span data-lucide="alert-circle"></span>阻塞</span></div>` : ''}
    ${hasProgress ? `<div class="subtask-progress"><div class="subtask-progress-bar ${progressPct >= 100 ? 'done' : 'partial'}" style="width:${progressPct}%;"></div></div>` : ''}
    <div class="kb-card-meta">
      ${task.dueDate ? `<span class="kb-card-meta-item"><span data-lucide="calendar"></span>${task.dueDate}</span>` : ''}
      ${hasProgress ? `<span class="kb-card-meta-item"><span data-lucide="list-checks"></span>${task.subtasks.done}/${task.subtasks.total}</span>` : ''}
      ${task.sprint ? `<span class="kb-card-meta-item"><span data-lucide="milestone"></span>${task.sprint}</span>` : ''}
    </div>
    ${!isReleasedOrArchived ? `<div class="kb-card-actions">
      <button class="md3-btn-tonal" onclick="event.stopPropagation();confirmFlow('${task.id}','${col.id}')" ${col.sort >= Math.max(...state.columns.filter(c => !c.archived).map(c => c.sort)) ? 'disabled' : ''}>
        <span data-lucide="arrow-right"></span> 确认
      </button>
      <button class="md3-btn-text" onclick="event.stopPropagation();openBackSelector('${task.id}','${col.id}')">
        <span data-lucide="arrow-left"></span> Back
      </button>
    </div>` : ''}
  </div>`;
}

// ============================================================
// KANBAN DRAG & DROP
// ============================================================
let dragTaskId = null;
let dragSourceCol = null;

function onDragStart(e) {
  dragTaskId = e.target.closest('.kb-card')?.dataset.taskId;
  dragSourceCol = e.target.closest('.kb-card')?.dataset.col;
  if (dragTaskId) {
    e.target.closest('.kb-card').classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }
}

function onDragOver(e) {
  e.preventDefault();
  const col = e.currentTarget.closest('.kb-col');
  if (col) col.classList.add('drag-over');
}

function onDragLeave(e) {
  const col = e.currentTarget.closest('.kb-col');
  if (col) col.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  const col = e.currentTarget.closest('.kb-col');
  if (col) col.classList.remove('drag-over');
  const targetColId = col?.dataset.col;
  if (!dragTaskId || !targetColId || dragSourceCol === targetColId) {
    dragTaskId = null; dragSourceCol = null;
    return;
  }
  const targetTasks = state.kanbanData[targetColId] || [];
  const targetCol = state.columns.find(c => c.id === targetColId);
  if (targetCol && targetCol.capacity > 0 && targetTasks.length >= targetCol.capacity) {
    showToast('"' + targetCol.name + '" 已达到容量上限，无法移入', 'warning');
    dragTaskId = null; dragSourceCol = null;
    renderKanbanBoard();
    return;
  }
  const srcTasks = state.kanbanData[dragSourceCol] || [];
  const idx = srcTasks.findIndex(t => t.id === dragTaskId);
  if (idx !== -1) {
    const task = srcTasks.splice(idx, 1)[0];
    if (!state.kanbanData[targetColId]) state.kanbanData[targetColId] = [];
    state.kanbanData[targetColId].push(task);
    const folder = getCurrentFolder();
    if (folder) folder.todo_count = Object.values(state.kanbanData).flat().length;
    renderSidebar();
    renderKanbanBoard();
  }
  dragTaskId = null; dragSourceCol = null;
}

// ============================================================
// KANBAN CONFIRM / BACK FLOW
// ============================================================
function confirmFlow(taskId, fromCol) {
  const cols = [...state.columns].sort((a,b) => a.sort - b.sort);
  const idx = cols.findIndex(c => c.id === fromCol);
  if (idx >= cols.length - 1) return;
  let nextIdx = idx + 1;
  while (nextIdx < cols.length && cols[nextIdx].archived) nextIdx++;
  if (nextIdx >= cols.length) return;
  const targetCol = cols[nextIdx];
  const targetTasks = state.kanbanData[targetCol.id] || [];
  if (targetCol.capacity > 0 && targetTasks.length >= targetCol.capacity) {
    showToast('"' + targetCol.name + '" 已达到容量上限，无法流转', 'warning');
    return;
  }
  const srcTasks = state.kanbanData[fromCol] || [];
  const ti = srcTasks.findIndex(t => t.id === taskId);
  if (ti !== -1) {
    const task = srcTasks.splice(ti, 1)[0];
    if (!state.kanbanData[targetCol.id]) state.kanbanData[targetCol.id] = [];
    state.kanbanData[targetCol.id].push(task);
    const folder = getCurrentFolder();
    if (folder) folder.todo_count = Object.values(state.kanbanData).flat().length;
    renderSidebar();
    renderKanbanBoard();
  }
}

function openBackSelector(taskId, fromCol) {
  const cols = [...state.columns].sort((a,b) => a.sort - b.sort);
  const fromIdx = cols.findIndex(c => c.id === fromCol);
  const availCols = cols.filter((c,i) => i < fromIdx && !c.archived);
  const list = document.getElementById('back-col-list');
  let listHtml = '';
  for (const c of availCols) {
    const tasks = state.kanbanData[c.id] || [];
    const capFull = c.capacity > 0 && tasks.length >= c.capacity;
    const clickHandler = capFull ? '' : "selectBackTarget('" + taskId + "','" + fromCol + "','" + c.id + "')";
    listHtml += '<div style="padding:12px 14px;border:1px solid var(--outline-variant);border-radius:var(--radius-md);margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px;' + (capFull ? 'opacity:0.5;' : '') + '" onclick="' + clickHandler + '">' +
      '<span style="flex:1;font-size:14px;font-weight:500;">' + c.name + '</span>' +
      '<span style="font-size:12px;color:var(--on-surface-variant);">' + tasks.length + (c.capacity > 0 ? '/' + c.capacity : '') + '</span>' +
      (capFull ? '<span style="font-size:11px;color:var(--warning);font-weight:600;padding:1px 6px;background:var(--warning-container);border-radius:var(--radius-xs);">已达上限</span>' : '') +
    '</div>';
  }
  list.innerHTML = listHtml;
  document.getElementById('back-col-selector').classList.add('open');
  lucide.createIcons({root: list});
  document.getElementById('back-col-selector').dataset.taskId = taskId;
  document.getElementById('back-col-selector').dataset.fromCol = fromCol;
}

function selectBackTarget(taskId, fromCol, targetCol) {
  const srcTasks = state.kanbanData[fromCol] || [];
  const ti = srcTasks.findIndex(t => t.id === taskId);
  if (ti !== -1) {
    const task = srcTasks.splice(ti, 1)[0];
    if (!state.kanbanData[targetCol]) state.kanbanData[targetCol] = [];
    state.kanbanData[targetCol].push(task);
    const folder = getCurrentFolder();
    if (folder) folder.todo_count = Object.values(state.kanbanData).flat().length;
    renderSidebar();
    renderKanbanBoard();
  }
  closeBackSelector();
}

function closeBackSelector() {
  document.getElementById('back-col-selector').classList.remove('open');
}

function showColMenu(e, colId) {
  e.stopPropagation();
  openKanbanSettings();
}

function closeFolderDialog() {

}

function selectFolderMode(mode) {
  folderMode = mode;
  document.querySelectorAll('#folder-mode-select button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });

  document.getElementById('folder-save-btn').textContent = mode === 'kanban' ? '创建 Kanban 文件夹' : '创建文件夹';

function renderColorPicker(containerId, selected) {

  ).join('');

function selectSwatch(el, prefix) {

function saveFolder() {

function addColumn() {
  const newId = 'col-' + Date.now();

function editColumn(colId) {

  document.getElementById('column-edit-cn').value = col.cn;

  document.getElementById('column-edit-modal').classList.add('open');
}

function closeColumnEdit() {
  document.getElementById('column-edit-modal').classList.remove('open');
}

function saveColumnEdit() {
  const colId = document.getElementById('column-edit-modal').dataset.colId;
  const col = state.columns.find(c => c.id === colId);
  if (!col) return;
  col.name = document.getElementById('column-edit-name').value || col.name;
  col.cn = document.getElementById('column-edit-cn').value || col.cn;
  col.capacity = parseInt(document.getElementById('column-edit-capacity').value) || 0;
  col.archived = document.getElementById('column-edit-archived').checked;
  closeColumnEdit();
  renderColumnList();
  renderKanbanBoard();
}

function deleteColumn(colId) {
  const cols = [...state.columns].sort((a,b) => a.sort - b.sort);
  if (cols.length <= 1) { showToast('无法删除最后一列', 'error'); return; }
  const tasks = state.kanbanData[colId] || [];
  const col = state.columns.find(c => c.id === colId);
  if (!col) return;

  if (tasks.length > 0) {
    const targetCols = state.columns.filter(c => c.id !== colId);
    const sel = document.getElementById('delete-col-target');
    sel.innerHTML = targetCols.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('delete-col-msg').textContent = `"${col.name}" 中包含 ${tasks.length} 个任务，请选择迁移目标：`;
    document.getElementById('delete-col-confirm').dataset.colId = colId;
    document.getElementById('delete-col-confirm').classList.add('open');
  } else {
    state.columns = state.columns.filter(c => c.id !== colId);
    delete state.kanbanData[colId];
    renderColumnList();
    renderKanbanBoard();
  }
}

function closeDeleteColConfirm() {
  document.getElementById('delete-col-confirm').classList.remove('open');
}

function confirmDeleteColumn() {
  const colId = document.getElementById('delete-col-confirm').dataset.colId;
  const targetId = document.getElementById('delete-col-target').value;
  const tasks = state.kanbanData[colId] || [];
  if (targetId && tasks.length > 0) {
    if (!state.kanbanData[targetId]) state.kanbanData[targetId] = [];
    state.kanbanData[targetId].push(...tasks);
  }
  delete state.kanbanData[colId];
  state.columns = state.columns.filter(c => c.id !== colId);
  closeDeleteColConfirm();
  renderColumnList();
  renderKanbanBoard();
}

// -- Fields --
function renderFieldList() {
  const list = document.getElementById('field-list');
  list.innerHTML = state.fields.map((f,i) =>
    `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--outline-variant);border-radius:var(--radius-sm);margin-bottom:4px;">
      <div style="flex:1;">
        <span style="font-size:13px;font-weight:500;">${f.name}</span>
        <span style="font-size:11px;color:var(--on-surface-variant);margin-left:6px;">${f.type}</span>
        ${f.required ? '<span style="font-size:11px;color:var(--error);margin-left:4px;">必填</span>' : ''}
        ${f.builtin ? '<span style="font-size:11px;color:var(--on-surface-variant);margin-left:4px;">系统字段</span>' : ''}
      </div>
      ${!f.builtin ? `<button class="md3-btn-text btn-sm" onclick="editCustomField(${i})"><span data-lucide="pencil"></span></button>
      <button class="md3-btn-text btn-sm" style="color:var(--error);" onclick="deleteCustomField(${i})"><span data-lucide="trash-2"></span></button>` : ''}
    </div>`
  ).join('');
  setTimeout(() => lucide.createIcons({root: list}), 0);
}

function addCustomField() {
  const name = prompt('字段名称：');
  if (!name) return;
  const type = prompt('字段类型：text / textarea / select / date / number / checkbox / checklist', 'text');
  if (!type) return;
  state.fields.push({
    id: 'f-' + Date.now(), name, type: type || 'text', required: false, builtin: false
  });
  renderFieldList();
}

function editCustomField(idx) {
  const field = state.fields[idx];
  const name = prompt('字段名称：', field.name);
  if (name) field.name = name;
  renderFieldList();
}

function deleteCustomField(idx) {
  state.fields.splice(idx, 1);
  renderFieldList();
}

function resetFields() {
  if (confirm('恢复默认模板将重置所有自定义字段，确认？')) {
    state.fields = [
      { id: 'f-name', name: '任务名称', type: 'text', required: true, builtin: true },
      { id: 'f-status', name: '状态', type: 'select', required: true, builtin: true },
      { id: 'f-version', name: '所属版本', type: 'text', required: false, builtin: false },
      { id: 'f-type', name: '任务类型', type: 'select', required: false, builtin: false },
      { id: 'f-priority', name: '优先级', type: 'select', required: false, builtin: false },
      { id: 'f-requirement', name: '需求说明', type: 'textarea', required: false, builtin: false },
      { id: 'f-tech', name: '技术说明', type: 'textarea', required: false, builtin: false },
      { id: 'f-acceptance', name: '验收标准', type: 'checklist', required: false, builtin: false },
    ];
    renderFieldList();
  }
}

// -- Sprints --
function renderSprintList() {
  const list = document.getElementById('sprint-list');
  list.innerHTML = state.sprints.map((s, i) =>
    `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--outline-variant);border-radius:var(--radius-md);margin-bottom:6px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:500;">${s.name} <span style="font-size:12px;font-weight:400;color:var(--on-surface-variant);">${s.status === 'active' ? '进行中' : s.status === 'completed' ? '已完成' : '未开始'}</span></div>
        <div style="font-size:12px;color:var(--on-surface-variant);">${s.goal || '无目标'} ${s.startDate ? '· '+s.startDate+' → '+s.endDate : ''}</div>
      </div>
      <button class="md3-btn-text btn-sm" onclick="editSprint(${i})"><span data-lucide="pencil"></span></button>
      <button class="md3-btn-text btn-sm" style="color:var(--error);" onclick="deleteSprint(${i})"><span data-lucide="trash-2"></span></button>
    </div>`
  ).join('');
  setTimeout(() => lucide.createIcons({root: list}), 0);
}

let sprintEditIdx = -1;
function addSprint() {
  sprintEditIdx = -1;
  document.getElementById('sprint-edit-title').textContent = '新建 Sprint';
  document.getElementById('sprint-edit-name').value = '';
  document.getElementById('sprint-edit-goal').value = '';
  document.getElementById('sprint-edit-start').value = '';
  document.getElementById('sprint-edit-end').value = '';
  document.getElementById('sprint-edit-status').value = 'planned';
  document.getElementById('sprint-edit-modal').classList.add('open');
}

function editSprint(idx) {
  sprintEditIdx = idx;
  const s = state.sprints[idx];
  document.getElementById('sprint-edit-title').textContent = '编辑 Sprint';
  document.getElementById('sprint-edit-name').value = s.name;
  document.getElementById('sprint-edit-goal').value = s.goal || '';
  document.getElementById('sprint-edit-start').value = s.startDate || '';
  document.getElementById('sprint-edit-end').value = s.endDate || '';
  document.getElementById('sprint-edit-status').value = s.status;
  document.getElementById('sprint-edit-modal').classList.add('open');
}

function closeSprintEdit() {
  document.getElementById('sprint-edit-modal').classList.remove('open');
}

function saveSprint() {
  const name = document.getElementById('sprint-edit-name').value.trim();
  if (!name) { showToast('请输入 Sprint 名称', 'error'); return; }
  const data = {
    name,
    goal: document.getElementById('sprint-edit-goal').value.trim(),
    startDate: document.getElementById('sprint-edit-start').value,
    endDate: document.getElementById('sprint-edit-end').value,
    status: document.getElementById('sprint-edit-status').value,
  };
  if (sprintEditIdx >= 0) {
    Object.assign(state.sprints[sprintEditIdx], data);
  } else {
    state.sprints.push({ id: 'sp-' + Date.now(), ...data });
  }
  closeSprintEdit();
  renderSprintList();
}

function deleteSprint(idx) {
  const s = state.sprints[idx];
  const hasTasks = Object.values(state.kanbanData).flat().some(t => t.sprint === s.name);
  if (hasTasks) {
    const sel = document.getElementById('delete-sprint-target');
    const others = state.sprints.filter((_, i) => i !== idx);
    sel.innerHTML = `<option value="unassigned">未分配</option>` + others.map(s2 => `<option value="${s2.name}">${s2.name}</option>`).join('');
    document.getElementById('delete-sprint-msg').textContent = `"${s.name}" 中有任务引用，请选择迁移目标：`;
    document.getElementById('delete-sprint-confirm').dataset.sprintIdx = idx;
    document.getElementById('delete-sprint-confirm').classList.add('open');
  } else {
    state.sprints.splice(idx, 1);
    renderSprintList();
  }
}

function closeDeleteSprintConfirm() {
  document.getElementById('delete-sprint-confirm').classList.remove('open');
}

function confirmDeleteSprint() {
  const idx = parseInt(document.getElementById('delete-sprint-confirm').dataset.sprintIdx);
  const targetName = document.getElementById('delete-sprint-target').value;
  const s = state.sprints[idx];
  if (targetName && s) {
    Object.keys(state.kanbanData).forEach(colId => {
      state.kanbanData[colId] = state.kanbanData[colId].map(t => ({
        ...t, sprint: t.sprint === s.name ? targetName : t.sprint
      }));
    });
  }
  state.sprints.splice(idx, 1);
  closeDeleteSprintConfirm();
  renderSprintList();
}

// -- Preferences --
function renderPrefDefaults() {
  const sel = document.getElementById('pref-default-col');
  const cols = [...state.columns].sort((a,b) => a.sort - b.sort);
  sel.innerHTML = cols.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// ============================================================
// NEW TASK
// ============================================================
function openNewTask(targetCol) {
  document.getElementById('new-task-name').value = '';
  document.getElementById('new-task-priority').value = 'P1';
  document.getElementById('new-task-type').value = 'feature';
  document.getElementById('new-task-version').value = '';
  document.getElementById('new-task-due').value = '';
  document.getElementById('new-task-tags').value = '';
  document.getElementById('new-task-desc').value = '';
  document.getElementById('new-task-target-col').value = targetCol;
  const sprintSel = document.getElementById('new-task-sprint');
  sprintSel.innerHTML = state.sprints.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('new-task-dialog').classList.add('open');
}

function closeNewTask() {
  document.getElementById('new-task-dialog').classList.remove('open');
}

function saveNewTask() {
  const name = document.getElementById('new-task-name').value.trim();
  if (!name) { showToast('请输入任务名称', 'error'); return; }
  const targetCol = document.getElementById('new-task-target-col').value;
  const sprintEl = document.getElementById('new-task-sprint');
  const sprintName = sprintEl.options[sprintEl.selectedIndex]?.text || '';

  if (isKanbanView()) {
    const colId = targetCol || state.columns.sort((a,b) => a.sort - b.sort)[0]?.id;
    const newTask = {
      id: 'kb-' + Date.now(),
      title: name,
      priority: document.getElementById('new-task-priority').value,
      type: document.getElementById('new-task-type').value,
      version: document.getElementById('new-task-version').value || '-',
      tags: document.getElementById('new-task-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      dueDate: document.getElementById('new-task-due').value || null,
      sprint: sprintName,
      subtasks: { done: 0, total: 0 },
      blocked: false,
      note: document.getElementById('new-task-desc').value,
      requirements: '',
      techNotes: '',
      acceptance: [],
    };
    if (!state.kanbanData[colId]) state.kanbanData[colId] = [];
    state.kanbanData[colId].push(newTask);
    closeNewTask();
    renderKanbanBoard();
    showToast('任务已创建', 'success');
  } else {
    const folder = getCurrentFolder();
    const newTodo = {
      id: 't-' + Date.now(),
      title: name,
      completed: false,
      priority: parseInt(document.getElementById('new-task-priority').value.replace('P','')) || 1,
      dueDate: document.getElementById('new-task-due').value || null,
      tags: document.getElementById('new-task-tags').value.split(',').map(t => t.trim()).filter(Boolean),
      folder_id: folder?.id || null,
      note: document.getElementById('new-task-desc').value,
      children: [],
      createdAt: new Date().toISOString().split('T')[0],
      updatedAt: new Date().toISOString().split('T')[0],
    };
    state.todos.push(newTodo);
    closeNewTask();
    renderSidebar();
    renderContent();
    showToast('任务已创建', 'success');
  }
}

// ============================================================
// TASK DETAIL DRAWER
// ============================================================
function openDrawer(taskId, colId) {
  const col = state.columns.find(c => c.id === colId);
  const tasks = state.kanbanData[colId] || [];
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  document.getElementById('drawer-title').textContent = task.title;
  const body = document.getElementById('drawer-body');
  const cols = [...state.columns].sort((a,b) => a.sort - b.sort);
  const pClass = (task.priority || '').toLowerCase();

  body.innerHTML = `
    <div class="drawer-section">
      <div class="drawer-section-label">基础信息</div>
      <div class="drawer-field-row">
        <span class="md3-chip md3-chip-${pClass}">${task.priority}</span>
        <span class="md3-chip-type ${task.type}">${task.type}</span>
        <span class="todo-chip"><span data-lucide="milestone"></span>${col?.name || '未知列'}</span>
        ${task.sprint ? `<span class="todo-chip"><span data-lucide="milestone"></span>${task.sprint}</span>` : ''}
        ${task.version ? `<span class="md3-version-chip">${task.version}</span>` : ''}
      </div>
      <div class="drawer-field-row">
        ${task.tags.map(t => `<span class="md3-tag">${t}</span>`).join('')}
      </div>
      ${task.dueDate ? `<div class="drawer-stat"><span data-lucide="calendar"></span>截止日期：${task.dueDate}</div>` : ''}
      <div class="drawer-stat"><span data-lucide="list-checks"></span>${task.subtasks.total > 0 ? '子任务：' + task.subtasks.done + '/' + task.subtasks.total : '无子任务'}</div>
      ${task.blocked ? `<div class="drawer-stat" style="color:var(--error);"><span data-lucide="alert-circle"></span>阻塞中</div>` : ''}
    </div>

    <div class="drawer-section">
      <div class="drawer-section-label">状态列</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${cols.map(c => {
          const tasksInCol = state.kanbanData[c.id] || [];
          const isCapFull = c.capacity > 0 && tasksInCol.length >= c.capacity;
          const isCurrent = c.id === colId;
          const canClick = !isCurrent && !isCapFull;
          return `<button style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-xl);font-size:13px;font-weight:500;border:1px solid ${isCurrent?'var(--primary)':'var(--outline-variant)'};background:${isCurrent?'var(--primary-container)':'transparent'};color:${isCurrent?'var(--on-primary-container)':(isCapFull?'var(--warning)':'var(--on-surface)')};cursor:${canClick?'pointer':'default'};opacity:${isCapFull&&!isCurrent?0.5:1};transition:all 0.15s;" ${canClick ? `onclick="moveTaskToCol('${taskId}','${colId}','${c.id}')"` : ''}>
            ${c.name}
            ${isCapFull ? '<span data-lucide="alert-triangle" style="width:12px;height:12px;"></span>' : ''}
          </button>`;
        }).join('')}
      </div>
      ${task.acceptance && task.acceptance.length > 0 ? `
      <div class="drawer-section" style="margin-top:20px;">
        <div class="drawer-section-label">验收标准</div>
        ${task.acceptance.map(a => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--outline-variant);"><input type="checkbox" style="width:16px;height:16px;border-radius:3px;border:2px solid var(--outline);accent-color:var(--primary);" /> ${a}</div>`).join('')}
      </div>` : ''}
    </div>

    ${task.note ? `
    <div class="drawer-section">
      <div class="drawer-section-label">说明</div>
      <div style="background:var(--surface-container);border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;">${task.note}</div>
    </div>` : ''}

    <div class="drawer-section">
      <div class="drawer-section-label">流转日志</div>
      <div class="drawer-log-item"><span class="drawer-log-dot"></span><strong>创建</strong> · 放入 "${col?.name}" <span class="drawer-log-time">${new Date().toLocaleDateString()}</span></div>
      <div class="drawer-log-item"><span class="drawer-log-dot"></span><strong>编辑</strong> · 更新描述 <span class="drawer-log-time">${new Date().toLocaleDateString()}</span></div>
    </div>

    <div style="padding-top:16px;border-top:1px solid var(--outline-variant);">
      <button class="md3-btn-text" style="color:var(--error);" onclick="if(confirm('确认删除此任务？')) deleteTaskFromDrawer('${taskId}','${colId}')">
        <span data-lucide="trash-2"></span> 删除任务
      </button>
    </div>
  `;
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('task-drawer').classList.add('open');
  lucide.createIcons({root: body});
}

function moveTaskToCol(taskId, fromCol, toCol) {
  const srcTasks = state.kanbanData[fromCol] || [];
  const ti = srcTasks.findIndex(t => t.id === taskId);
  if (ti === -1) return;
  const task = srcTasks.splice(ti, 1)[0];
  if (!state.kanbanData[toCol]) state.kanbanData[toCol] = [];
  state.kanbanData[toCol].push(task);
  renderSidebar();
  renderKanbanBoard();
  openDrawer(taskId, toCol);
}

function deleteTaskFromDrawer(taskId, colId) {
  if (state.kanbanData[colId]) {
    state.kanbanData[colId] = state.kanbanData[colId].filter(t => t.id !== taskId);
  }
  const folder = getCurrentFolder();
  if (folder) folder.todo_count = Object.values(state.kanbanData).flat().length;
  renderSidebar();
  renderKanbanBoard();
  closeDrawer();
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('task-drawer').classList.remove('open');
}

// ============================================================
// KANBAN FILTERS
// ============================================================
function filterKanbanBySprint(sprintId) {
  const cards = document.querySelectorAll('.kb-card');
  cards.forEach(card => {
    const taskId = card.dataset.taskId;
    let found = false;
    for (const colId of Object.keys(state.kanbanData)) {
      const task = state.kanbanData[colId].find(t => t.id === taskId);
      if (task) {
        if (!sprintId) found = true;
        else {
          const sprint = state.sprints.find(s => s.id === sprintId);
          found = sprint ? task.sprint === sprint.name : true;
        }
        break;
      }
    }
    card.style.display = found ? '' : 'none';
  });
}

function filterKanbanCards(query) {
  const cards = document.querySelectorAll('.kb-card');
  cards.forEach(card => {
    const title = card.querySelector('.kb-card-title');
    if (title) {
      card.style.display = title.textContent.includes(query) ? '' : 'none';
    }
  });
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
